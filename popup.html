<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 275px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 14px;
      background: #f5f7fa;
      color: #2d3b45;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #001e44;
      border-bottom: 2px solid #001e44;
      padding-bottom: 6px;
    }
    .master-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #001e44;
      color: #ffffff;
      padding: 9px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      margin-bottom: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .toggle-row:hover {
      border-color: #001e44;
    }
    .calc-row {
      background: #eef6ff;
      border-color: #99ccff;
      color: #004080;
      font-weight: 600;
      display: none;
    }
    .disabled-group {
      opacity: 0.4;
      pointer-events: none;
    }
    .note {
      font-size: 11px;
      color: #6b7280;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h3>🎯 PSU Canvas Grade Focus</h3>

  <!-- Master Toggle to turn the entire extension UI on or off -->
  <label class="master-toggle">
    <span>⚡ Enable Grade Focus UI</span>
    <input type="checkbox" id="pop-extensionEnabled" checked>
  </label>

  <div id="sub-toggles">
    <!-- Only appears on classes where the professor disabled grade calculation -->
    <label class="toggle-row calc-row" id="row-calcTotals">
      <span>🧮 Calculate Disabled Totals</span>
      <input type="checkbox" id="pop-calcTotals">
    </label>

    <label class="toggle-row">
      <span>Hide 100% / EX / 0-pt</span>
      <input type="checkbox" id="pop-hidePerfect">
    </label>

    <label class="toggle-row">
      <span>Hide Ungraded (- / 100)</span>
      <input type="checkbox" id="pop-hideUngraded">
    </label>

    <label class="toggle-row">
      <span>To-Do Only (Hide Graded)</span>
      <input type="checkbox" id="pop-hideGraded">
    </label>

    <label class="toggle-row">
      <span>Hide Bottom Totals</span>
      <input type="checkbox" id="pop-hideTotals">
    </label>

    <label class="toggle-row">
      <span>Dim Instead of Hide</span>
      <input type="checkbox" id="pop-dimMode">
    </label>
  </div>

  <div class="note" id="status-note">Weights auto-save per class.</div>

  <script src="popup.js"></script>
</body>
</html>
