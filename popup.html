<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 14px;
      background: #f5f7fa;
      color: #2d3b45;
    }
    h3 {
      margin: 0 0 12px 0;
      font-size: 15px;
      color: #001e44;
      border-bottom: 2px solid #001e44;
      padding-bottom: 6px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      margin-bottom: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .toggle-row:hover {
      border-color: #001e44;
    }
    .note {
      font-size: 11px;
      color: #6b7280;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h3>🎯 PSU Canvas Grade Focus</h3>
  
  <label class="toggle-row">
    <span>Hide 100% / EX / 0-pt</span>
    <input type="checkbox" id="pop-hidePerfect">
  </label>

  <label class="toggle-row">
    <span>Hide Ungraded (- / 100)</span>
    <input type="checkbox" id="pop-hideUngraded">
  </label>

  <label class="toggle-row">
    <span>To-Do Only (Hide Graded)</span>
    <input type="checkbox" id="pop-hideGraded">
  </label>

  <label class="toggle-row">
    <span>Dim Instead of Hide</span>
    <input type="checkbox" id="pop-dimMode">
  </label>

  <div class="note" id="status-note">Resets automatically on page refresh.</div>

  <script src="popup.js"></script>
</body>
</html>
